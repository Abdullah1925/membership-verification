<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول — إدارة العضويات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            text-align: right;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 36px 30px;
            max-width: 420px;
            width: 100%;
            margin: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #0f172a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            margin: 0 auto 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px;
            color: #0f172a;
        }

        p.sub {
            text-align: center;
            color: #64748b;
            margin: 0 0 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            direction: ltr;
            text-align: left;
            background: #f8fafc;
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .login-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 6px;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .error {
            color: #dc2626;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            background: #fef2f2;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #fecaca;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">MC</div>
        <h1 id="titleText">إدارة العضويات</h1>
        <p class="sub" id="subText">تسجيل الدخول للوصول إلى لوحة التحكم</p>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="email" id="emailLabel">البريد الإلكتروني</label>
                <input type="email" id="email" autocomplete="username" placeholder="admin@example.com" required>
            </div>

            <div class="form-group">
                <label for="password" id="passwordLabel">كلمة المرور</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>

            <div class="error hidden" id="loginError"></div>
        </form>

        <footer id="footerText">مجلس التنسيق و التوافق محافظة المهرة — وصول المشرفين فقط</footer>
    </div>

    <script type="module" src="assets/js/login.js"></script>

</body>
</html>
