<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login — Mahra Council</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            padding: 30px 28px;
            max-width: 400px;
            width: 100%;
            margin: 20px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background: #1f2937;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            margin: 0 auto 14px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            margin: 0 0 4px;
            color: #1f2937;
        }

        p.sub {
            text-align: center;
            color: #6b7280;
            margin: 0 0 22px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .error {
            color: #dc2626;
            margin-top: 12px;
            font-size: 14px;
        }

        footer {
            margin-top: 22px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">MC</div>
        <h1>Membership Administration</h1>
        <p class="sub">Sign in to access the dashboard</p>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>

            <div class="error" id="loginError"></div>
        </form>

        <footer>Mahra Council — staff access only</footer>
    </div>

    <script type="module" src="assets/js/login.js"></script>

</body>
</html>
