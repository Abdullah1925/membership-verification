<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator — Membership Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 25px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .container {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 20px 60px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            font-family: Consolas, monospace;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #eef2ff;
            color: #4338ca;
        }

        .btn-secondary:hover {
            background: #e0e7ff;
        }

        .btn-ghost {
            background: transparent;
            color: #6b7280;
            border: 1px solid #d1d5db;
            padding: 7px 12px;
            font-weight: 500;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .message {
            font-size: 13px;
            margin-top: 10px;
        }

        .message.error {
            color: #b91c1c;
        }

        .message.success {
            color: #15803d;
        }

        .hidden {
            display: none;
        }

        /* QR grid */
        #qrGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
        }

        .qr-cell {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            background: #fff;
            break-inside: avoid;
        }

        .qr-cell img {
            width: 140px;
            height: 140px;
            image-rendering: pixelated;
        }

        .qr-cell .qr-id {
            font-weight: bold;
            margin: 8px 0 2px;
            word-break: break-all;
        }

        .qr-cell .qr-url {
            font-size: 11px;
            color: #6b7280;
            word-break: break-all;
            margin-bottom: 8px;
        }

        .qr-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        @media print {
            header, .panel, .print-hide {
                display: none !important;
            }

            body {
                background: white;
            }

            .container {
                margin: 0;
                padding: 0;
                max-width: none;
            }

            #qrGrid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            .qr-cell {
                border: 1px solid #bbb;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>QR Code Generator — Membership Cards</h1>
    </header>

    <div class="container">

        <div class="panel">
            <div class="form-group">
                <label for="baseUrl">Verification page URL</label>
                <input type="text" id="baseUrl" placeholder="https://your-org.github.io/membership-verification/verify.html">
                <p style="font-size:12px;color:#6b7280;margin:6px 0 0;">
                    Each QR scans to this page with <code>?serial=&lt;member_id&gt;</code> appended.
                </p>
            </div>

            <div class="form-group">
                <label for="idInput">Member IDs — one per line, or paste a CSV column</label>
                <textarea id="idInput" placeholder="1001&#10;1002&#10;1003&#10;&#10;pastes like:&#10;member_id,name,status,&#10;1001,John Doe,valid,&#10;1002,Jane Smith,valid,"></textarea>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-secondary" id="loadCsvBtn">Import CSV file</button>
                <input type="file" id="csvFile" accept=".csv,text/csv" class="hidden">
                <button type="button" class="btn btn-primary" id="generateBtn">Generate QR Codes</button>
            </div>

            <div class="message" id="message"></div>
        </div>

        <div class="panel hidden" id="resultPanel">
            <div class="actions print-hide" style="margin-bottom:14px;">
                <span style="font-weight:bold;" id="resultCount"></span>
                <button type="button" class="btn btn-secondary" id="printBtn">Print / PDF</button>
            </div>
            <div id="qrGrid"></div>
        </div>

        <p style="color:#9ca3af;font-size:12px;">
            Runs entirely in your browser — nothing is uploaded. Print renders one page per card batch.
        </p>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script type="module" src="assets/js/qr.js"></script>

</body>
</html>
